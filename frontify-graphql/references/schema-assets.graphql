type AssetProvenance {
  """
  **BETA** Whether a credential was found, absent, could not be read, is still being extracted, or cannot be extracted for this file.
  """
  state: AssetProvenanceState!

  """
  **BETA** How the content was generated, derived from the credential's declared source types.
  """
  contentOrigin: AssetProvenanceContentOrigin

  """**BETA** Whether the credential itself could be confirmed."""
  certStatus: AssetProvenanceCertStatus

  """
  **BETA** Organization the signing certificate was issued to, as its subject.
  """
  certSubject: String

  """
  **BETA** Name of the software that generated the content, as the credential declares it.
  """
  generatorName: String

  """
  **BETA** Version of the generating software, as the credential declares it.
  """
  generatorVersion: String

  """**BETA** Issuer of the signing certificate."""
  certIssuer: String

  """**BETA** When the signing certificate was issued."""
  certIssuedAt: DateTime

  """**BETA** When the signing certificate expires."""
  certExpiresAt: DateTime
}

enum AssetProvenanceState {
  """An embedded credential was found and read."""
  DETECTED

  """The file was examined and carries no embedded credential."""
  NO_CREDENTIAL

  """
  Extraction could not complete, so nothing was established about the file either way.
  """
  FAILED

  """Extraction has been requested and has not finished yet."""
  PROCESSING

  """The file does not support content credentials."""
  UNSUPPORTED
}

enum AssetProvenanceContentOrigin {
  """
  No AI was declared: either the credential positively attributes the content to real-world capture, human authorship, or an automated-but-not-AI source, or it declares no source type at all. Both reach the same conclusion — there is no evidence of AI — and this is not a claim that no AI was used.
  """
  NO_AI_DECLARED

  """
  Generative AI touched part of the content — for example an inpainted region on a photograph.
  """
  AI_ASSISTED

  """The content was created by a trained AI model."""
  AI_GENERATED
}

enum AssetProvenanceCertStatus {
  """
  The credential's signature validated against a signer on the trust list.
  """
  TRUSTED

  """
  The file's content or claim hash binding failed validation - the file was altered after signing.
  """
  TAMPERED

  """
  The signature is self-consistent but trust could not be confirmed: an unrecognized signer, or a certificate that aged out without a trusted timestamp.
  """
  NOT_TRUSTED
}

