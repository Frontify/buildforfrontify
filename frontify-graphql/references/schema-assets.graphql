  """
  assets: [AssetUpdateEntryInput!]!
}

"""One `Asset`'s requested changes."""
input AssetUpdateEntryInput {
  """`Asset` Id."""
  id: ID!

  """The fields to change on this `Asset`."""
  data: AssetUpdateEntryDataInput!
}

"""
The fields one `Asset` update entry changes. Omitted fields are left untouched.
"""
input AssetUpdateEntryDataInput {
  """`Asset` title or display name. `null` clears it."""
  title: String

  """`Asset` description. `null` clears it."""
  description: String

  """
  Alternative text for the `Asset`. Used by screen readers when the asset is not decorative. `null` clears it.
  """
  alternativeText: String

  """
  Whether the `Asset` is decorative. Decorative assets are skipped by screen readers. Does not accept `null`; omit the field to leave it unchanged.
  """
  isDecorative: Boolean

  """
  Represents the Author of the `Asset`. Example: Photographer Name. `null` clears it.
  """
  author: String

  """
  `Asset` copyright status. `UNKNOWN` is the empty state; `null` is not accepted.
  """
  copyrightStatus: CopyrightStatus

  """`Asset` copyright notice. `null` clears it."""
  copyrightNotice: String

  """`Asset` filename, including extension. `null` clears it."""
  filename: String

  """
  Availability start date. The `Asset` becomes available once the defined date is reached. `null` clears it.
  """
  beginsAt: DateTime

  """
  Expiry date. The `Asset` expires once the defined date is reached. `null` clears it.
  """
  expiresAt: DateTime

  """
  Tags to add to the `Asset`. Existing tags are kept; an empty list equals omitting the field.
  """
  addTags: [TagInput!] = null

  """
  Tags to remove from the `Asset`. Applied after `addTags` — a tag listed in both ends up removed. An empty list equals omitting the field.
  """
  removeTags: [TagInput!] = null

  """
  The `WorkflowStatus` to assign to the `Asset`. `null` unassigns the current status.
  """
  workflowStatus: WorkflowStatusAssignmentInput

  """
  Custom metadata values to set on the `Asset`. Setting a value for a property deletes its current value on this `Asset` and stores the one you specify; properties not listed are untouched.
  """
  customMetadata: [CustomMetadataEntryInput!] = null

  """Library `Licenses` to add to the `Asset`."""
  addLicenses: [ID!] = null

  """
  `Collection` ids to add the `Asset` to. Only curated collections in the call's `Library` are accepted. An empty list equals omitting the field.
  """
  addCollections: [ID!] = null
}

type UpdateAssets {
  """
  Outcome of the bulk update. Changes apply independently per asset and per field; a partial failure does not roll back applied changes.
  """
  status: UpdateAssetsStatus!

  """
  Failures only: an `Asset` absent from this list had every requested change applied in full.
  """
  failedAssets: [FailedAssetUpdate!]!

  """
  `Assets` touched by this mutation, reflecting their state after whatever changes succeeded. Includes assets with field errors, since those were still partially updated; excludes assets present in `failedAssets` with a non-null `code`, since those were not touched at all.
  """
  updatedAssets: [Asset!]!
}

enum UpdateAssetsStatus {
  """Every requested change was applied."""
  SUCCEEDED

  """Some requested changes were applied; others failed."""
  PARTIALLY_SUCCEEDED

  """No requested change was applied."""
  FAILED
}

type FailedAssetUpdate {
  """`Asset` Id."""
  id: ID!

  """
  Whole-asset failure code — none of the entry's changes were applied. `null` when the asset itself was writable and only individual fields failed; see `fieldErrors`.
  """
  code: AssetUpdateFailureCode

  """
  The entry fields that did not apply; every other requested field was applied. An asset whose every requested field failed carries all its field errors and counts as failed.
  """
  fieldErrors: [AssetFieldError!]!
}

enum AssetUpdateFailureCode {
  """The `Asset` does not exist, or is not accessible to the caller."""
  ASSET_NOT_FOUND

  """The caller can view the `Asset` but lacks edit permission."""
  ASSET_NOT_EDITABLE
}

type AssetFieldError {
  """The input field that did not apply."""
  field: AssetUpdateFieldName!

  """
  Opaque id of the referenced property, license, or collection. Set only for `CUSTOM_METADATA`, `ADD_LICENSES`, and `ADD_COLLECTIONS` field errors; `null` otherwise.
  """
  id: ID

  """Why the field did not apply."""
  code: AssetUpdateFieldErrorCode!
}

enum AssetUpdateFieldName {
  TITLE
  DESCRIPTION
  ALTERNATIVE_TEXT
  IS_DECORATIVE
  AUTHOR
  BEGINS_AT
  EXPIRES_AT
  COPYRIGHT_STATUS
  COPYRIGHT_NOTICE
  FILENAME
  WORKFLOW_STATUS
  ADD_TAGS
  REMOVE_TAGS
  ADD_LICENSES
  CUSTOM_METADATA
  ADD_COLLECTIONS
}

