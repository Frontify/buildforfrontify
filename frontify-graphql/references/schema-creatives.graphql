type CreativeExport {
  """`CreativeJob` Id."""
  id: ID!

  """`CreativeJob` status."""
  status: CreativeJobStatus!

  """Generated Creative."""
  result: CreativeResult
}

"""List of possible `Creative Job` statuses."""
enum CreativeJobStatus {
  """The job is currently being prepared and is awaiting rendering."""
  PROCESSING

  """The job is currently rendering."""
  RENDERING

  """The job has been canceled successfully."""
  CANCELED

  """The job has been completed successfully."""
  FINISHED

  """The processing of the job failed."""
  FAILED
}

type CreativeResult {
  """Signed `Url` to download the Creative."""
  downloadUrl: Url!

  """List of signed `Url`s to download each page of the Creative."""
  pageDownloadUrls: [Url!]!

  """`Asset` details of the stored asset when save-to has been used."""
  asset: File
}

input ExportCreativeInput {
  """`CreativeTemplateId` Id."""
  templateId: ID!

  """
  `ExportCreativeDestinationInput` where the exported file will be uploaded.
  """
  destination: ExportCreativeDestinationInput

  """List of `CreativeVariableInput` which will be applied to the template."""
  variables: [CreativeVariableInput]

  """`ExportCreativeOptionsInput` data."""
  options: ExportCreativeOptionsInput
}

input ExportCreativeDestinationInput {
  """`Project` Id destination for the exported Creative."""
  destinationId: ID!

  """`Title` of file."""
  title: String!
}

input CreativeVariableInput {
  """Template variable `Key`."""
  key: String!

  """`Value` of template variable."""
  value: Any
}

input ExportCreativeOptionsInput {
  """`Format` of exported file."""
  format: CreativeExportFormat

  """`Quality` of exported file. Supported only for `JPG` `Format`."""
  quality: CreativeExportQuality

  """
  `TransparentBackground` export parameter. Supported only by `PNG` `Format`.
  """
  hasTransparentBackground: Boolean

  """
  List of pages to export. If provided, validates that all requested pages exist in a template before export. If not provided, all pages will be exported.
  """
  pages: [Int!]

  """
  **BETA** Frames per second for the exported file. Supported only for `GIF` (possible values: 10, 12, 15, 24, 30) and `MP4` (possible values: 15, 24, 40) `Format`.
  """
  fps: Int

  """
  **BETA** Scale percentage for the exported video. Accepts values between `50` and `200`. Supported only for `GIF` and `MP4` `Format`.
  """
  scale: Int

  """
  **BETA** If true, the exported GIF will not loop. Supported only for `GIF` `Format`.
  """
  noLoop: Boolean

  """
  **BETA** If true, a static fallback image will be generated along with the exported HTML. Supported only for `HTML` `Format`.
  """
  fallback: Boolean

  """
  **BETA** Specifies the ad network for which the HTML is being exported. Supported only for `HTML` `Format`.
  """
  adsNetwork: CreativeExportAdsNetwork

  """
  **BETA** If provided, a click-through URL will be embedded in the exported HTML. Supported only for `HTML` `Format`. Only secure HTTPS URLs are accepted.
  """
  clickTagUrl: String
}

"""
Compression level, affecting quality and filesize of the exported Creative.
"""
enum CreativeExportQuality {
  MAXIMUM
  HIGH
  MEDIUM
  LOW
}

"""
Specifies the ad network, affecting the structure of the exported HTML.
"""
enum CreativeExportAdsNetwork {
  GOOGLE
}

