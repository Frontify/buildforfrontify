}

type InstallBrandEssentialsSelfhostedFontFormatError {
  """**BETA** The file Id of the font format that could not be installed."""
  fileId: ID!

  """
  **BETA** The machine readable reason why the font format could not be installed.
  """
  code: InstallBrandEssentialsSelfhostedFontFormatErrorCode!

  """**BETA** A human readable description of the reason."""
  message: String!
}

"""The reason why a selfhosted font format could not be installed."""
enum InstallBrandEssentialsSelfhostedFontFormatErrorCode {
  """The font style and format is already installed for the brand."""
  ALREADY_INSTALLED

  """The referenced font file does not exist."""
  FILE_NOT_FOUND

  """The referenced file is not a supported font file."""
  VALIDATION_FAILED

  """The font metadata could not be read from the referenced font file."""
  PARSING_FAILED
}

