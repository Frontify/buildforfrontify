"""
How close a hit must be to the search term before it is worth returning.
"""
enum SearchRelevance {
  """
  The floor guideline search has always used, tuned for someone typing into the search box, where an
  unrelated hit is more costly than a missing one. The default for every query that does not say
  otherwise, so existing callers keep the behaviour they had.
  """
  DEFAULT

  """
  A markedly lower floor -- roughly a tenth of {@see self::DEFAULT}. For callers that would rather sift
  loosely related content than miss it, such as gathering a broad candidate set to rank or summarise
  themselves. Expect noticeably more hits, and noticeably weaker ones.
  """
  LOW
}

