type CustomMetadataPropertyPermissions {
  """
  **BETA** List of basic permissions defined for the custom metadata property.
  """
  basic: [CustomMetadataPropertyBasicPermission]

  """
  **BETA** List of custom permissions defined for the custom metadata property.
  """
  custom: [CustomMetadataPropertyCustomPermission]
}

type CustomMetadataPropertyBasicPermission {
  """**BETA** Subject granted with the permission."""
  subject: CustomMetadataPropertyBasicPermissionSubject!

  """**BETA** Permission level granted to the subject."""
  permissionLevel: CustomMetadataPropertyPermissionLevel!
}

"""Subjects defined for basic custom metadata property permissions."""
enum CustomMetadataPropertyBasicPermissionSubject {
  """Everyone."""
  EVERYONE

  """Only authenticated users."""
  INTERNAL

  """
  Those with `edit` permissions in the scope where the property is defined.
  """
  EDITOR

  """
  Those with folder-level `edit` permissions in the project where the property is defined.
  """
  CONTENT_EDITOR

  """
  Those with `admin` permissions in the scope where the property is defined.
  """
  ADMIN
}

"""Permission levels allowed for a custom metadata property."""
enum CustomMetadataPropertyPermissionLevel {
  """Allows updating and deleting `CustomMetadataProperty` items"""
  ADMIN

  """
  Allows assigning, updating or removing `CustomMetadataProperty` values.
  """
  EDIT

  """
  Allows viewing the custom metadata property and its custom metadata values.
  """
  VIEW
}

type CustomMetadataPropertyCustomPermission {
  """
  **BETA** Subject representing the specific user or group granted with the permission.
  """
  subject: AccountCollaborator!

  """**BETA** Permission level granted to the subject."""
  permissionLevel: CustomMetadataPropertyPermissionLevel!
}

type WorkflowTask {
  """**BETA** `WorkflowTask` Id."""
  id: ID!

