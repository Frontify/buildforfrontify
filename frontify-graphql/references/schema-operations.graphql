type RootQuery {
  """Get the current `User`."""
  currentUser: User!

  """Retrieve current `Account` details."""
  account: Account!

  """
  **DEPRECATED** Retrieve `Project` details by Id. This field will be removed. Use `library` or `workspaceProject` instead. | Date: 2023-01-01
  """
  project(
    """`Project` Id."""
    id: ID!
  ): Project @deprecated(reason: "This field will be removed. Use `library` or `workspaceProject` instead. | Date: 2023-01-01")

  """Retrieve `Library` details by Id."""
  library(
    """`Library` Id."""
    id: ID!
  ): Library

  """Retrieve `WorkspaceProject` details by Id."""
  workspaceProject(
    """`Workspace` Id."""
    id: ID!
  ): Workspace

  """Retrieve `Assets` details by Ids."""
  assets(
    """`Asset` Ids."""
    ids: [ID!]!
  ): [Asset]

  """Retrieve `Asset` details by Id."""
  asset(
    """`Asset` Id."""
    id: ID!
  ): Asset

  """Retrieve a `CreativeTemplate` item by Id."""
  creativeTemplate(
    """`CreativeTemplate` Id."""
    id: ID!
  ): CreativeTemplate

  """Retrieve a `CreativeExport` item by `CreativeJob` Id."""
  creativeExport(
    """`CreativeJob` Id."""
    id: ID!
  ): CreativeExport

  """Retrieve a `Brand` by its Id."""
  brand(
    """`Brand` Id."""
    id: ID!
  ): Brand

  """Retrieve `Brand` list for current `Account`."""
  brands: [Brand]

  """**BETA** Retrieve a `GuidelinePage` by its id."""
  guidelinePage(
    """**BETA** The id of the `GuidelinePage` to retrieve."""
    id: ID!

    """
    **BETA** Specifies the language in which the GuidelinePage should be delivered. If the requested language is unavailable, the default language will be used as a fallback.
    """
    language: LanguageCode
  ): GuidelinePage

  """Retrieve `Node` details by Id."""
  node(
    """`Node` Id."""
    id: ID!
  ): Node

  """**BETA** Retrieve the account-bound ServiceApps"""
  serviceApps(
    """**BETA**"""
    limit: Int = 25

    """**BETA**"""
    page: Int = 1
  ): ServiceAppItems

  """Retrieve `WebhookItems` related to current `Account`."""
  webhooks(
    """How many `WebhookItems` to show per query. Min: 1, Max: 100."""
    limit: Int = 25

    """Current page number."""
    page: Int = 1
  ): WebhookItems
}


